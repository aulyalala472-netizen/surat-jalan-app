<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Input Barang & foto</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-slate-800 p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-boxes-packing text-red-500"></i> Form Input Data Barang
                </h1>
                <p class="text-slate-400 text-xs mt-1">Upload foto langsung dari kamera atau galeri perangkat</p>
            </div>
            <button type="button" onclick="addNewRow()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-md transition flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> Tambah Baris
            </button>
        </div>

        <!-- Form & Table Area -->
        <form id="itemForm" class="p-6">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-600">
                    <thead class="bg-slate-50 text-slate-700 uppercase border-b border-slate-200">
                        <tr>
                            <th class="p-3">Nama Barang</th>
                            <th class="p-3 w-32">Jumlah</th>
                            <th class="p-3 w-48">Lampiran Foto</th>
                            <th class="p-3 w-16 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <!-- Baris tabel akan ditambahkan secara dinamis lewat JS -->
                    </tbody>
                </table>
            </div>

            <!-- Action Submit -->
            <div class="mt-6 flex justify-end gap-3 border-t border-slate-100 pt-4">
                <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs px-6 py-2.5 rounded-xl transition shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Simpan Semua Data
                </button>
            </div>
        </form>
    </div>

    <!-- MODAL GALERI & KAMERA -->
    <div id="cameraModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-4 space-y-3 shadow-2xl border border-gray-100">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-images text-red-600"></i> Lampirkan Foto Barang
                </h3>
                <button type="button" onclick="closeCameraModal()" class="text-gray-400 hover:text-red-600 font-bold text-lg">&times;</button>
            </div>
            
            <!-- Preview / Area Tampilan Kamera -->
            <div class="relative bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center">
                <video id="webcamVideo" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="photoCanvas" class="hidden"></canvas>
            </div>

            <!-- Tombol Aksi Tambah Foto -->
            <div class="flex flex-col gap-2 pt-2">
                <!-- Hidden Input File untuk Galeri -->
                <input type="file" id="galleryInput" accept="image/*" class="hidden" onchange="handleGalleryUpload(this)">
                
                <div class="flex gap-2 justify-between">
                    <!-- Tombol Pilih dari Galeri -->
                    <button type="button" onclick="document.getElementById('galleryInput').click()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 transition">
                        <i class="fa-solid fa-folder-open text-blue-600"></i> Ambil dari Galeri
                    </button>
                    
                    <!-- Tombol Tangkap Kamera -->
                    <button type="button" onclick="capturePhoto()" class="flex-1 py-2 bg-red-700 hover:bg-red-800 text-white text-xs font-bold rounded-xl shadow-md flex items-center justify-center gap-1.5 transition">
                        <i class="fa-solid fa-camera"></i> Foto Kamera
                    </button>
                </div>
                
                <button type="button" onclick="closeCameraModal()" class="w-full py-1.5 text-gray-500 hover:text-gray-700 text-xs font-bold rounded-xl border border-gray-200 mt-1">
                    Batal
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Source -->
    <script src="app.js"></script>
</body>
</html>
