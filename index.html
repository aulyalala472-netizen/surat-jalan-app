<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Input Barang & Galeri Foto</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-boxes-packing text-red-600"></i> Form Input Data Barang
        </h2>

        <!-- Tabel Barang -->
        <div class="overflow-x-auto mb-4">
            <table class="w-full text-left border-collapse" id="itemsTable">
                <thead>
                    <tr class="bg-gray-100 text-gray-700 text-sm border-b">
                        <th class="p-3">Nama Barang</th>
                        <th class="p-3 w-48">Foto</th>
                        <th class="p-3 w-28 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Baris Item 1 (Default) -->
                    <tr class="border-b item-row">
                        <td class="p-3 align-top">
                            <input type="text" name="nama_barang[]" placeholder="Masukkan nama barang..." class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-red-500">
                        </td>
                        <td class="p-3 align-top">
                            <!-- Hidden input untuk menyimpan Base64 foto -->
                            <input type="hidden" name="foto_barang[]" class="foto-data">
                            
                            <!-- Container Preview Foto -->
                            <div class="foto-preview-container hidden mb-2 relative group w-24 h-24 rounded-lg overflow-hidden border">
                                <img src="" alt="Preview" class="foto-preview w-full h-full object-cover">
                                <button type="button" onclick="removePhoto(this)" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center opacity-80 hover:opacity-100">&times;</button>
                            </div>

                            <button type="button" onclick="openCameraModal(this)" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow-sm flex items-center gap-1">
                                <i class="fa-solid fa-camera"></i> Upload / Ambil Foto
                            </button>
                        </td>
                        <td class="p-3 align-top text-center">
                            <button type="button" onclick="removeRow(this)" class="px-2 py-1.5 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg text-xs font-semibold">
                                <i class="fa-solid fa-trash"></i> Hapus
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button type="button" onclick="addNewRow()" class="px-4 py-2 bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold rounded-xl shadow-md flex items-center gap-2 mb-6">
            <i class="fa-solid fa-plus"></i> Tambah Baris
        </button>
    </div>

    <!-- Modal Kamera & Galeri -->
    <div id="cameraModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-4 space-y-3 shadow-2xl border border-gray-100">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-image text-red-600"></i> Ambil / Pilih Foto Barang
                </h3>
                <button type="button" onclick="closeCameraModal()" class="text-gray-400 hover:text-red-600 font-bold text-lg">&times;</button>
            </div>
            
            <!-- Live Preview Kamera -->
            <div class="relative bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center">
                <video id="webcamVideo" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="photoCanvas" class="hidden"></canvas>
            </div>

            <!-- Hidden Input File untuk Galeri -->
            <input type="file" id="galleryFileInput" accept="image/*" class="hidden" onchange="handleGalleryUpload(this)">

            <div class="flex gap-2 justify-between pt-2">
                <!-- Tombol Tambah dari Galeri -->
                <button type="button" onclick="document.getElementById('galleryFileInput').click()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-md flex items-center gap-1.5">
                    <i class="fa-solid fa-folder-open"></i> Galeri
                </button>

                <div class="flex gap-2">
                    <button type="button" onclick="closeCameraModal()" class="px-4 py-2 bg-gray-200 text-gray-700 text-xs font-bold rounded-xl hover:bg-gray-300">
                        Batal
                    </button>
                    <button type="button" onclick="capturePhoto()" class="px-4 py-2 bg-red-700 hover:bg-red-800 text-white text-xs font-bold rounded-xl shadow-md flex items-center gap-1.5">
                        <i class="fa-solid fa-camera"></i> Ambil Foto
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Link -->
    <script src="app.js"></script>
</body>
</html>
